<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive August 7 IELTS vocabulary, modifier, and sub-question practice lab">
  <title>August 7 · Vocabulary / Modifiers / IELTS Sub-Questions</title>
  <script>
    (() => {
      try {
        const saved = localStorage.getItem('grammar-ielts-theme');
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');
    :root {
      color-scheme: light;
      --background: #FFFFFF;
      --foreground: #111827;
      --primary: #3B82F6;
      --primary-hover: #2563EB;
      --secondary: #10B981;
      --secondary-soft: #D1FAE5;
      --accent: #F59E0B;
      --accent-soft: #FEF3C7;
      --danger: #DC2626;
      --danger-soft: #FEE2E2;
      --muted: #F3F4F6;
      --muted-strong: #E5E7EB;
      --border: #E5E7EB;
      --surface: #FFFFFF;
      --surface-inverse: #111827;
      --blue-soft: #DBEAFE;
      --text-muted: #4B5563;
      --hero-text: #EFF6FF;
      --radius-md: 6px;
      --radius-lg: 8px;
      --font: "Avenir Next", "Trebuchet MS", Arial, sans-serif;
      --transition: all 200ms ease;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --background: #0B1220;
      --foreground: #F9FAFB;
      --primary: #60A5FA;
      --primary-hover: #3B82F6;
      --secondary: #34D399;
      --secondary-soft: #052E2B;
      --accent: #FBBF24;
      --accent-soft: #451A03;
      --danger: #F87171;
      --danger-soft: #450A0A;
      --muted: #111827;
      --muted-strong: #1F2937;
      --border: #374151;
      --surface: #111827;
      --surface-inverse: #F9FAFB;
      --blue-soft: #172554;
      --text-muted: #CBD5E1;
      --hero-text: #DBEAFE;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--foreground);
      background: var(--background);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
    }

    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1, h2, h3, h4 { line-height: 1; letter-spacing: -0.02em; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 80;
      background: var(--surface);
      border-bottom: 4px solid var(--primary);
    }

    .header-inner {
      width: min(1280px, calc(100% - 32px));
      min-height: 76px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 20px;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      color: #FFFFFF;
      background: var(--primary);
      border-radius: var(--radius-lg);
      font-weight: 800;
    }

    .brand-copy strong {
      display: block;
      font-size: clamp(1rem, 2vw, 1.2rem);
      font-weight: 800;
    }

    .brand-copy span {
      display: block;
      color: var(--text-muted);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle,
    .header-link,
    .btn,
    .collapse-btn,
    .toc-link,
    .back-to-toc {
      border: 0;
      border-radius: var(--radius-md);
      font-weight: 700;
      transition: var(--transition);
    }

    .theme-toggle,
    .header-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      font-size: .76rem;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .header-link { color: #FFFFFF; background: var(--primary); }
    .theme-toggle { color: var(--foreground); background: var(--muted-strong); }
    .theme-toggle:hover, .header-link:hover { transform: scale(1.04); }
    .header-link:hover { background: var(--primary-hover); }

    .page-shell {
      width: min(1280px, calc(100% - 32px));
      margin: 24px auto 72px;
    }

    .hero {
      position: relative;
      min-height: 570px;
      display: grid;
      grid-template-columns: 7fr 5fr;
      overflow: hidden;
      color: #FFFFFF;
      background: var(--primary);
      border-radius: var(--radius-lg);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .hero::before {
      width: 340px;
      height: 340px;
      left: -130px;
      bottom: -150px;
      background: var(--accent);
      transform: rotate(15deg);
    }

    .hero::after {
      width: 310px;
      height: 310px;
      left: 45%;
      top: -170px;
      border-radius: 50%;
      background: var(--secondary);
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 7vw, 82px);
    }

    .eyebrow,
    .section-kicker,
    .question-meta,
    .config-label {
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .eyebrow { color: #FEF3C7; }

    h1 {
      max-width: 9ch;
      margin: 20px 0 28px;
      font-size: clamp(3.6rem, 9vw, 8rem);
      font-weight: 800;
      line-height: .82;
      letter-spacing: -.045em;
    }

    .hero-copy p {
      max-width: 60ch;
      margin: 0;
      color: var(--hero-text);
      font-size: clamp(1rem, 1.6vw, 1.22rem);
    }

    .hero-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .chip {
      padding: 9px 12px;
      color: #111827;
      background: #FFFFFF;
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hero-guide {
      position: relative;
      z-index: 3;
      align-self: center;
      margin: clamp(24px, 5vw, 54px);
      padding: clamp(26px, 4vw, 40px);
      color: var(--foreground);
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .hero-guide h2 {
      margin-bottom: 22px;
      color: var(--secondary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .w-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .w-item {
      padding: 14px;
      background: var(--muted);
      border-radius: var(--radius-md);
    }

    .w-item strong { display: block; color: var(--primary); }
    .w-item span { color: var(--text-muted); font-size: .86rem; }

    .toc-panel {
      margin-top: 24px;
      padding: clamp(26px, 4vw, 42px);
      color: #FFFFFF;
      background: #111827;
      border-radius: var(--radius-lg);
      scroll-margin-top: 100px;
    }

    html[data-theme="dark"] .toc-panel { background: #030712; }

    .toc-panel h2 {
      margin-bottom: 20px;
      color: var(--secondary);
      font-size: .8rem;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    .toc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 10px;
    }

    .toc-link {
      min-height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 15px;
      color: #FFFFFF;
      background: #1F2937;
      text-decoration: none;
    }

    .toc-link:hover {
      color: #111827;
      background: var(--secondary);
      transform: translateX(5px);
    }

    .toc-link small { color: var(--accent); font-weight: 800; }
    .toc-link:hover small { color: #111827; }

    .section-card {
      margin-top: 24px;
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-lg);
      scroll-margin-top: 96px;
    }

    .section-header {
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: clamp(30px, 5vw, 62px);
      color: #111827;
      background: var(--accent);
    }

    .section-card:nth-of-type(3n+2) .section-header { background: var(--secondary); }
    .section-card:nth-of-type(3n+3) .section-header { color: #FFFFFF; background: var(--primary); }

    .section-kicker { margin-bottom: 12px; opacity: .78; }
    .section-header h2 {
      max-width: 18ch;
      margin: 0;
      font-size: clamp(2.4rem, 6vw, 5rem);
      font-weight: 800;
    }

    .collapse-btn {
      min-height: 54px;
      flex: 0 0 auto;
      padding: 0 18px;
      color: #111827;
      background: #FFFFFF;
      border: 4px solid #111827;
      font-size: .75rem;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .collapse-btn:hover { color: #FFFFFF; background: #111827; transform: scale(1.04); }

    .section-body {
      padding: clamp(24px, 4vw, 48px);
      background: var(--muted);
    }

    .section-explanation {
      margin-bottom: 24px;
      padding: 24px;
      color: var(--foreground);
      background: var(--blue-soft);
      border-radius: var(--radius-lg);
    }

    .section-explanation strong { color: var(--primary); }

    .exercise-list { display: grid; gap: 24px; }

    .exercise-card {
      overflow: hidden;
      background: var(--surface);
      border-radius: var(--radius-lg);
      scroll-margin-top: 104px;
    }

    .exercise-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      color: #FFFFFF;
      background: #111827;
    }

    html[data-theme="dark"] .exercise-head { background: #030712; }

    .exercise-head-copy { padding: 26px; }
    .exercise-head h3 {
      margin-bottom: 8px;
      font-size: clamp(1.6rem, 3vw, 2.5rem);
      font-weight: 800;
    }
    .exercise-head p { margin: 0; color: #D1D5DB; }

    .score-block {
      min-width: 170px;
      display: grid;
      place-items: center;
      padding: 18px;
      color: #111827;
      background: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-align: center;
      text-transform: uppercase;
    }

    .exercise-config {
      padding: 18px 24px;
      background: var(--muted-strong);
    }

    .exercise-config summary {
      cursor: pointer;
      color: var(--primary);
      font-weight: 800;
      list-style: none;
    }
    .exercise-config summary::-webkit-details-marker { display: none; }
    .exercise-config summary::after { content: " +"; }
    .exercise-config[open] summary::after { content: " -"; }

    .config-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .config-item {
      padding: 12px;
      background: var(--surface);
      border-radius: var(--radius-md);
    }
    .config-label { display: block; margin-bottom: 4px; color: var(--primary); }
    .config-value { color: var(--text-muted); font-size: .88rem; }

    .progress-track { height: 12px; background: var(--border); }
    .progress-fill { width: 0; height: 100%; background: var(--secondary); transition: width 200ms ease; }

    .question-stage { padding: clamp(24px, 4vw, 38px); }
    .question-meta { margin-bottom: 12px; color: var(--primary); }
    .question-text {
      margin: 0 0 24px;
      color: var(--foreground);
      font-size: clamp(1.3rem, 2.8vw, 2.05rem);
      font-weight: 800;
      line-height: 1.24;
      white-space: pre-line;
    }

    .answer-input,
    .writing-field,
    .final-response {
      width: 100%;
      color: var(--foreground);
      background: var(--muted);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      outline: 0;
      transition: var(--transition);
    }

    .answer-input { min-height: 58px; padding: 0 16px; font-size: 1.05rem; }
    .writing-field { min-height: 48px; padding: 10px 12px; }
    .final-response { min-height: 150px; padding: 14px; resize: vertical; }

    .answer-input:focus,
    .writing-field:focus,
    .final-response:focus {
      background: var(--surface);
      border-color: var(--primary);
    }

    .answer-input:disabled,
    .writing-field:disabled,
    .final-response:disabled {
      opacity: 1;
      color: var(--text-muted);
      background: var(--muted-strong);
      cursor: not-allowed;
    }

    .option-list { display: grid; gap: 10px; }

    .option-btn {
      width: 100%;
      min-height: 58px;
      padding: 14px 16px;
      color: var(--foreground);
      background: var(--muted);
      border: 0;
      border-radius: var(--radius-md);
      text-align: left;
      font-weight: 700;
      transition: var(--transition);
    }

    .option-btn:hover:not(:disabled) { color: #FFFFFF; background: var(--primary); transform: translateX(5px); }
    .option-btn.correct-choice { color: #052E16; background: #86EFAC; }
    .option-btn.wrong-choice { color: #450A0A; background: #FCA5A5; }
    .option-btn:disabled { cursor: not-allowed; }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      min-height: 54px;
      padding: 0 18px;
      font-size: .78rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .btn:hover:not(:disabled) { transform: scale(1.04); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn-primary { color: #FFFFFF; background: var(--primary); }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { color: var(--foreground); background: var(--muted-strong); }
    .btn-accent { color: #111827; background: var(--accent); }
    .btn-success { color: #052E16; background: var(--secondary); }
    .btn-danger { color: #FFFFFF; background: var(--danger); }

    .feedback {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius-lg);
      white-space: pre-line;
    }
    .feedback.correct { color: var(--foreground); background: var(--secondary-soft); border-left: 8px solid var(--secondary); }
    .feedback.incorrect { color: var(--foreground); background: var(--danger-soft); border-left: 8px solid var(--danger); }
    .feedback.neutral { color: var(--foreground); background: var(--blue-soft); border-left: 8px solid var(--primary); }

    .finish-panel {
      padding: 28px;
      background: var(--blue-soft);
      border-radius: var(--radius-lg);
    }
    .finish-panel h4 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 20px 0;
    }
    .metric { padding: 16px; background: var(--surface); border-radius: var(--radius-md); }
    .metric strong { display: block; color: var(--primary); font-size: 1.6rem; }
    .metric span { color: var(--text-muted); font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }

    .review-box { margin-top: 20px; padding: 18px; background: var(--surface); border-radius: var(--radius-lg); }
    .review-label { color: var(--primary); font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .review-answer { margin-top: 8px; color: var(--text-muted); }
    .review-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }

    .review-topics { margin: 18px 0 0; padding-left: 22px; }
    .review-topics li { margin: 6px 0; color: var(--text-muted); }

    .ielts-intro-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, .8fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .excerpt-card,
    .timer-control-card,
    .writing-guide-card {
      padding: 22px;
      background: var(--surface);
      border-radius: var(--radius-lg);
    }

    .excerpt-card h3,
    .writing-guide-card h3 { font-size: 1.4rem; font-weight: 800; }
    .excerpt-card p { margin-bottom: 0; color: var(--text-muted); white-space: pre-line; }

    .timer-control-card { display: grid; gap: 14px; align-content: start; }
    .timer-display {
      min-height: 150px;
      display: grid;
      place-items: center;
      padding: 20px;
      color: #FFFFFF;
      background: var(--primary);
      text-align: center;
      border-radius: var(--radius-lg);
    }
    .timer-display strong { display: block; font-size: clamp(3rem, 7vw, 5rem); line-height: 1; letter-spacing: -.05em; }
    .timer-display span { font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .timer-display.warning { color: #111827; background: var(--accent); }

    .untimed-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      background: var(--muted);
      border-radius: var(--radius-md);
      font-weight: 800;
    }
    .untimed-row input { width: 22px; height: 22px; accent-color: var(--primary); }

    .sprint-toolbar {
      position: sticky;
      top: 80px;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px;
      color: #FFFFFF;
      background: #111827;
      border-radius: var(--radius-lg);
    }
    html[data-theme="dark"] .sprint-toolbar { background: #030712; }
    .sprint-toolbar strong { color: var(--secondary); }

    .sprint-question {
      margin-top: 12px;
      padding: 20px;
      background: var(--surface);
      border-radius: var(--radius-lg);
    }
    .sprint-question h4 { margin-bottom: 14px; font-size: 1.05rem; line-height: 1.35; }
    .dimension-badge {
      display: inline-block;
      margin-bottom: 8px;
      padding: 5px 8px;
      color: #111827;
      background: var(--accent);
      border-radius: 999px;
      font-size: .67rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .radio-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 8px;
      padding: 12px;
      background: var(--muted);
      border: 2px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
    }
    .radio-option input { margin-top: 4px; accent-color: var(--primary); }
    .radio-option.correct { border-color: var(--secondary); background: var(--secondary-soft); }
    .radio-option.incorrect { border-color: var(--danger); background: var(--danger-soft); }
    .radio-option.unanswered { border-color: var(--accent); }

    .question-explanation {
      margin-top: 10px;
      padding: 12px;
      color: var(--text-muted);
      background: var(--blue-soft);
      border-radius: var(--radius-md);
    }

    .writing-prompt {
      padding: 22px;
      color: #FFFFFF;
      background: var(--primary);
      border-radius: var(--radius-lg);
    }
    .writing-prompt h3 { margin-bottom: 10px; font-size: clamp(1.7rem, 4vw, 2.8rem); font-weight: 800; }
    .writing-prompt p { margin: 0; color: var(--hero-text); }

    .writing-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .writing-cell { padding: 14px; background: var(--surface); border-radius: var(--radius-md); }
    .writing-cell label { display: block; margin-bottom: 7px; color: var(--primary); font-weight: 800; }
    .writing-cell small { display: block; margin-bottom: 8px; color: var(--text-muted); }

    .final-answer-block { margin-top: 14px; padding: 18px; background: var(--surface); border-radius: var(--radius-lg); }
    .final-answer-block label { display: block; margin-bottom: 8px; font-weight: 800; }
    .word-count { margin-top: 8px; color: var(--text-muted); font-size: .8rem; font-weight: 700; }

    .source-note {
      margin-top: 24px;
      padding: 24px;
      color: var(--text-muted);
      background: var(--muted);
      border-radius: var(--radius-lg);
      font-size: .86rem;
    }

    .back-to-toc {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 60;
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      color: #111827;
      background: var(--accent);
      text-decoration: none;
      font-size: .74rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .back-to-toc:hover { color: #FFFFFF; background: #111827; transform: scale(1.05); }

    .sr-only {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      padding: 0 !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }

    button:focus-visible,
    a:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {

ial for many students."},{"word":"harmful","pos":"adjective","definition":"causing damage or negative effects","example":"Excessive screen time may be harmful to sleep quality."},{"word":"relevant","pos":"adjective","definition":"directly connected to the topic or situation","example":"Use examples that are relevant to the IELTS question."},{"word":"reliable","pos":"adjective","definition":"consistently dependable or likely to be correct","example":"Students should use reliable sources in academic writing."},{"word":"significant","pos":"adjective","definition":"important or large enough to be noticed","example":"The policy produced a significant reduction in waste."},{"word":"sustainable","pos":"adjective","definition":"able to continue for a long time without serious harm","example":"Cities need sustainable forms of transportation."}],"vocabBlanks":[["approach","The teacher changed her _____ after noticing that students learned better through examples."],["benefit","A major _____ of studying in a group is that students can explain difficult ideas to one another."],["consequence","One _____ of staying up too late is poor concentration the next morning."],["evidence","The researcher used survey results as _____ to support her conclusion."],["factor","Cost was the main _____ that influenced my choice of university."],["issue","Traffic congestion has become a serious _____ in the city center."],["method","Flashcards are one _____ I use to review vocabulary before a test."],["policy","The school introduced a new _____ requiring students to turn off phones during exams."],["resource","The public library is a useful _____ for students who need quiet study space."],["trend","The graph shows an upward _____ in the number of people working from home."],["achieve","She practiced speaking every day because she wanted to _____ a higher IELTS score."],["affect","A noisy environment can _____ how well students concentrate."],["assess","The teacher will _____ our presentations using clarity, organization, and accuracy."],["contribute","Regular exercise can _____ to better sleep and lower stress."],["decline","If ticket prices rise sharply, the number of passengers may _____."],["establish","The city plans to _____ a new recycling program next year."],["indicate","The survey results _____ that most students prefer shorter homework assignments."],["maintain","It is easier to _____ a study routine when you work at the same time every day."],["require","This assignment will _____ students to compare two different sources."],["respond","Schools need to _____ quickly when students report safety problems."],["available","Free tutoring is _____ every Tuesday and Thursday after school."],["beneficial","A short walk after dinner can be _____ for both physical and mental health."],["complex","Climate policy is a _____ issue because it involves science, economics, and politics."],["efficient","Taking the express train is more _____ because it saves nearly thirty minutes."],["essential","Clear topic sentences are _____ for organizing an IELTS essay."],["harmful","Too much screen time before bed may be _____ to sleep quality."],["relevant","Choose an example that is directly _____ to the question instead of changing the topic."],["reliable","Academic writing should be based on _____ information rather than random social-media posts."],["significant","The new bus lane caused a _____ reduction in travel time during rush hour."],["sustainable","Cycling and public transportation are more _____ forms of urban travel than driving alone."]],"modifierScope":[{"prompt":"Sentence: “Only Lina presented the proposal on Friday.” What does “only” limit?","options":["The person who presented it","The action of presenting","The proposal","Friday"],"correct":"The person who presented it","explanation":"Only is directly before Lina, so the meaning is that Lina—and nobody else—presented the proposal.","topic":"scope of limiting modifiers"},{"prompt":"Sentence: “Lina only presented the proposal on Friday.” What is the most natural focus of “only”?","options":["She presented it, but did not do some other action","Nobody except Lina presented it","She presented only one proposal","She presented it only on Friday"],"correct":"She presented it, but did not do some other action","explanation":"Placed before presented, only most directly limits the verb/action.","topic":"scope of limiting modifiers"},{"prompt":"Sentence: “Lina presented only the proposal on Friday.” What does “only” limit?","options":["What she presented","Who presented it","When she presented it","How she presented it"],"correct":"What she presented","explanation":"Only sits beside the proposal, so the object is limited.","topic":"scope of limiting modifiers"},{"prompt":"Sentence: “Lina presented the proposal only on Friday.” What does “only” limit?","options":["The time","The person","The object","The manner"],"correct":"The time","explanation":"Only directly modifies on Friday.","topic":"scope of limiting modifiers"},{"prompt":"Sentence: “Maya almost finished the report.” Which meaning is best?","options":["She did not completely finish the action","She finished nearly every section","She finished it very quickly","She finished it only once"],"correct":"She did not completely finish the action","explanation":"Almost before finished means the action came close to completion.","topic":"scope of almost"},{"prompt":"Sentence: “Maya finished almost the entire report.” Which meaning is best?","options":["She completed most of the report","She nearly began the report","She completed the report yesterday","She completed only the conclusion"],"correct":"She completed most of the report","explanation":"Almost modifies the entire report, so most—but not all—was completed.","topic":"scope of almost"},{"prompt":"Sentence: “The museum charges students just five dollars.” What does “just” emphasize?","options":["The low amount","The students only","The museum only","The act of charging recently"],"correct":"The low amount","explanation":"Just is directly before five dollars, so it limits/emphasizes the amount.","topic":"modifier next to amount"},{"prompt":"Sentence: “Noah usually reviews vocabulary before breakfast.” Why is “usually” well placed?","options":["Frequency adverbs normally come before a main verb","Frequency adverbs always go at the end","Frequency adverbs must come before the subject","Frequency adverbs must follow the object"],"correct":"Frequency adverbs normally come before a main verb","explanation":"Usually, often, and rarely generally appear before a normal main verb.","topic":"frequency adverb placement"},{"prompt":"Sentence: “We completed the survey at school yesterday.” What is the neutral order of the final details?","options":["Place before time","Time before object","Manner before subject","Frequency before object"],"correct":"Place before time","explanation":"A common neutral pattern is subject + verb + object + place + time.","topic":"place before time"},{"prompt":"Sentence: “We saw a man carrying a red umbrella.” Which word does “carrying a red umbrella” modify?","options":["man","we","saw","umbrella"],"correct":"man","explanation":"The descriptive phrase is next to man, the person carrying the umbrella.","topic":"modifier next to noun"},{"prompt":"Sentence: “The program reduced costs by nearly 20 percent.” What does “nearly” modify?","options":["20 percent","the program","reduced","costs"],"correct":"20 percent","explanation":"Nearly should sit directly before the amount it modifies.","topic":"modifier next to amount"},{"prompt":"Sentence: “The manager personally checked every application.” What does “personally” emphasize?","options":["The manager did the checking herself/himself","Every application was personal","The applications were checked slowly","The checking happened recently"],"correct":"The manager did the checking herself/himself","explanation":"Personally emphasizes the agent who performed the action.","topic":"emphasis adverb placement"}],"modifierRepair":[{"prompt":"Choose the sentence with no dangling modifier.","options":["After reading the article, Lina understood the main argument.","After reading the article, the main argument became clear to Lina.","After reading the article, there was a clearer conclusion.","After reading the article, the notes seemed easier."],"correct":"After reading the article, Lina understood the main argument.","explanation":"Lina is the person who read the article, so Lina must be the subject immediately after the opening phrase.","topic":"dangling introductory phrase"},{"prompt":"Choose the sentence that clearly says Priya was waiting for the bus.","options":["While waiting for the bus, Priya reviewed her notes.","While waiting for the bus, the notes helped Priya review.","While waiting for the bus, the rain began.","While waiting for the bus, there was time to review."],"correct":"While waiting for the bus, Priya reviewed her notes.","explanation":"The subject after the modifier must be the person performing the waiting action.","topic":"logical subject after modifier"},{"prompt":"Choose the sentence that clearly says the bicycle was covered in mud.","options":["Covered in mud, the bicycle needed a thorough cleaning.","Covered in mud, Tomas decided to clean the bicycle.","Covered in mud, the garage looked untidy.","Covered in mud, there was a bicycle by the door."],"correct":"Covered in mud, the bicycle needed a thorough cleaning.","explanation":"The noun immediately after the past-participle phrase must be the thing being described.","topic":"past-participle modifier"},{"prompt":"Choose the clearest sentence if Elena is the person preparing for the interview.","options":["To prepare for the interview, Elena practiced answering questions aloud.","To prepare for the interview, several questions were practiced aloud.","To prepare for the interview, the mirror helped Elena practice.","To prepare for the interview, there were questions to practice."],"correct":"To prepare for the interview, Elena practiced answering questions aloud.","explanation":"The subject after the infinitive phrase must be the person intending to prepare.","topic":"dangling infinitive phrase"},{"prompt":"Intended meaning: The coach spoke to Amir and nobody else. Choose the clearest sentence.","options":["The coach spoke only to Amir after practice.","Only the coach spoke to Amir after practice.","The coach only spoke to Amir after practice.","The coach spoke to Amir only after practice."],"correct":"The coach spoke only to Amir after practice.","explanation":"Only belongs directly beside to Amir because the person receiving the action is limited.","topic":"modifier next to prepositional phrase"},{"prompt":"Intended meaning: We met the teacher on Friday, not on another day. Choose the clearest sentence.","options":["We met the teacher only on Friday.","Only we met the teacher on Friday.","We only met the teacher on Friday.","We met only the teacher on Friday."],"correct":"We met the teacher only on Friday.","explanation":"Only sits next to the time phrase because Friday is the limited detail.","topic":"modifier next to time phrase"},{"prompt":"Choose the most natural sentence.","options":["I answered every question carefully.","I answered carefully every question.","I carefully every question answered.","Carefully I every question answered."],"correct":"I answered every question carefully.","explanation":"Keep the verb and object together; the manner adverb can follow the object.","topic":"verb-object-adverb order"},{"prompt":"Choose the most natural neutral sentence order.","options":["We completed the survey at school yesterday.","We yesterday completed at school the survey.","At school we yesterday the survey completed.","We completed yesterday the survey at school."],"correct":"We completed the survey at school yesterday.","explanation":"A reliable neutral order is subject + verb + object + place + time.","topic":"object-place-time order"},{"prompt":"Choose the sentence in which the researchers are clearly using the new method.","options":["Using the new method, the researchers collected more accurate data.","Using the new method, more accurate data were collected by the researchers.","Using the new method, the results appeared more accurate.","Using the new method, there were more accurate data."],"correct":"Using the new method, the researchers collected more accurate data.","explanation":"The researchers perform the using action, so they should immediately follow the modifier.","topic":"agent after introductory phrase"},{"prompt":"Choose the sentence in which the laptop is clearly the item bought last month.","options":["Bought last month, the laptop already needs a repair.","Bought last month, Jonah already needs to repair the laptop.","Bought last month, the repair shop examined the laptop.","Bought last month, there is already a problem with the laptop."],"correct":"Bought last month, the laptop already needs a repair.","explanation":"The noun after the modifier must be the item that was bought.","topic":"past-participle modifier"},{"prompt":"Intended meaning: She drove her children to school on most days, but not every day.","options":["She drove her children to school almost every day.","She almost drove her children to school every day.","Almost she drove her children to school every day.","She drove almost her children to school every day."],"correct":"She drove her children to school almost every day.","explanation":"Almost directly modifies every day, so it expresses frequency.","topic":"frequency phrase placement"},{"prompt":"Intended meaning: The reduction was a little less than 20 percent.","options":["The program reduced costs by nearly 20 percent.","The program nearly reduced costs by 20 percent.","Nearly the program reduced costs by 20 percent.","The program reduced nearly costs by 20 percent."],"correct":"The program reduced costs by nearly 20 percent.","explanation":"Nearly must be next to the numerical amount.","topic":"modifier next to amount"}],"modifierMeaning":[{"prompt":"Which sentence means that nobody except Maya borrowed the laptop?","options":["Only Maya borrowed the laptop after class.","Maya only borrowed the laptop after class.","Maya borrowed only the laptop after class.","Maya borrowed the laptop only after class."],"correct":"Only Maya borrowed the laptop after class.","explanation":"Moving only changes its scope. Here it directly limits Maya.","topic":"placement of only"},{"prompt":"Which sentence means Maya borrowed the laptop, but did not buy or repair it?","options":["Maya only borrowed the laptop after class.","Only Maya borrowed the laptop after class.","Maya borrowed only the laptop after class.","Maya borrowed the laptop only after class."],"correct":"Maya only borrowed the laptop after class.","explanation":"Only modifies the action borrowed.","topic":"placement of only"},{"prompt":"Which sentence means Maya borrowed the laptop and no other item?","options":["Maya borrowed only the laptop after class.","Only Maya borrowed the laptop after class.","Maya only borrowed the laptop after class.","Maya borrowed the laptop only after class."],"correct":"Maya borrowed only the laptop after class.","explanation":"Only limits the object the laptop.","topic":"placement of only"},{"prompt":"Which sentence means Maya borrowed the laptop after class and not at another time?","options":["Maya borrowed the laptop only after class.","Only Maya borrowed the laptop after class.","Maya only borrowed the laptop after class.","Maya borrowed only the laptop after class."],"correct":"Maya borrowed the laptop only after class.","explanation":"Only limits the time phrase after class.","topic":"placement of only"},{"prompt":"Which sentence means Sara did not completely finish the assignment?","options":["Sara almost completed the entire assignment.","Sara completed almost the entire assignment.","Almost Sara completed the entire assignment.","Sara completed the entire assignment almost."],"correct":"Sara almost completed the entire assignment.","explanation":"Almost modifies completed, so the action itself did not fully happen.","topic":"scope of almost"},{"prompt":"Which sentence means Sara completed most of the assignment?","options":["Sara completed almost the entire assignment.","Sara almost completed the entire assignment.","Almost Sara completed the entire assignment.","Sara completed the entire assignment almost."],"correct":"Sara completed almost the entire assignment.","explanation":"Almost modifies the amount of the assignment.","topic":"scope of almost"},{"prompt":"Which sentence most naturally means “a moment ago”?","options":["I just spoke with the director.","Just I spoke with the director.","I spoke just with the director.","I spoke with just the director."],"correct":"I just spoke with the director.","explanation":"Just before the main verb commonly expresses recent time.","topic":"placement of just"},{"prompt":"Which sentence means the museum charges no more than five dollars?","options":["The museum charges students just five dollars.","Just the museum charges students five dollars.","The museum just charges students five dollars.","The museum charges just students five dollars."],"correct":"The museum charges students just five dollars.","explanation":"Just directly limits the amount.","topic":"modifier next to amount"}],"passages":[{"key":"passage-1","label":"Passage 1 - Community garden","title":"Describe a useful community activity you joined.","sentences":["Last October, I joined a Saturday gardening project at a community center near my school.","My science teacher recommended it because the center needed volunteers to prepare vegetable beds for winter.","I worked with four other students and an elderly volunteer named Mr. Han.","At first, I did not know how deeply to plant the seedlings, so Mr. Han demonstrated the correct method.","We then measured the rows with a piece of string and watered each bed carefully.","By lunchtime, we had finished three beds that had been empty that morning.","Consequently, I could see a clear result from only a few hours of organized work.","The experience made me more interested in local environmental projects because the benefit felt immediate and practical."]},{"key":"passage-2","label":"Passage 2 - New bus route","title":"Describe a change in your area that improved daily life.","sentences":["In January, my city introduced an express bus route between my neighborhood and the main train station.","Before the change, I usually needed two buses and almost fifty minutes to reach the station.","The new route stops only three times, which makes the trip much more efficient.","I first tested it on a rainy Monday when I had an early class across town.","Instead of leaving home at 6:40, I left at 7:05 and still arrived before the same train.","Because the bus was less crowded, I was also able to review vocabulary during the journey.","As a result, the route saves me about twenty-five minutes on most school days.","For me, this small transport policy has had a significant effect on my morning routine."]},{"key":"passage-3","label":"Passage 3 - Pronunciation practice","title":"Describe a method that helped you learn a language.","sentences":["At the beginning of this year, I started recording one minute of English speech on my phone each evening.","I chose this approach after noticing that I understood new words but rarely used them aloud.","Each recording answered one simple question about my day, such as what I ate or where I went.","After recording, I listened once and wrote down two pronunciation problems.","I then repeated the same answer without reading a script.","Within six weeks, I hesitated less because the routine forced me to retrieve familiar vocabulary quickly.","My teacher also indicated that my final consonants had become clearer.","This method was beneficial because it required very little time but gave me reliable evidence of improvement."]},{"key":"passage-4","label":"Passage 4 - School recycling","title":"Describe an environmental issue at school and how students responded.","sentences":["Last semester, our class noticed that many plastic bottles were being thrown into ordinary classroom bins.","The main issue was that the recycling containers were located only near the cafeteria.","Our class representative asked the principal whether we could place a small recycling box in each classroom.","The principal agreed, but she required us to explain the system clearly to other students.","We created simple labels showing which materials were acceptable and attached them above the boxes.","For two weeks, we checked the containers every afternoon and corrected common mistakes.","After one month, the amount of recyclable plastic in the ordinary bins had declined noticeably.","The project showed me that a sustainable solution is easier to maintain when the correct action is convenient."]},{"key":"passage-5","label":"Passage 5 - Learning to cook","title":"Describe a useful skill you learned from another person.","sentences":["During the summer holiday, my grandmother taught me how to make a simple vegetable soup.","I wanted to learn because I was moving into a dormitory and could not rely on restaurant food every day.","She first showed me how to cut the vegetables into similar sizes so they would cook evenly.","Next, she asked me to taste the soup before adding more salt instead of following the recipe mechanically.","My first attempt was too watery, but she explained how simmering it longer would improve the texture.","The second bowl was much better, and I wrote the steps in a note on my phone.","Since then, I have used the same basic method with several different vegetables.","Learning one reliable recipe gave me more confidence because I could prepare an inexpensive meal by myself."]}],"clueQuestions":[{"passageKey":"passage-1","sentenceIndex":0,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “Last October”?","clue":"“Last October”","options":["When?","Who?","Where?","What is the main topic?"],"correct":"When?","explanation":"The time expression “Last October” directly answers when the event happened.","topic":"clue words and 5W1H"},{"passageKey":"passage-1","sentenceIndex":1,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “because”?","clue":"“because”","options":["Why?","Who?","Where?","What is the main topic?"],"correct":"Why?","explanation":"Because introduces the reason the teacher recommended the project.","topic":"clue words and 5W1H"},{"passageKey":"passage-1","sentenceIndex":3,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “so”?","clue":"“so”","options":["How was the problem solved?","Who?","Where?","What is the main topic?"],"correct":"How was the problem solved?","explanation":"So links the problem to the response: Mr. Han demonstrated the method.","topic":"clue words and 5W1H"},{"passageKey":"passage-2","sentenceIndex":0,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “between my neighborhood and the main train station”?","clue":"“between my neighborhood and the main train station”","options":["Where?","Why?","When?","How many?"],"correct":"Where?","explanation":"The route phrase identifies the two places connected by the bus.","topic":"clue words and 5W1H"},{"passageKey":"passage-2","sentenceIndex":3,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “on a rainy Monday”?","clue":"“on a rainy Monday”","options":["When?","Who?","Where?","What is the main topic?"],"correct":"When?","explanation":"The phrase gives the specific occasion when the speaker first tested the route.","topic":"clue words and 5W1H"},{"passageKey":"passage-2","sentenceIndex":6,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “As a result”?","clue":"“As a result”","options":["What was the result?","Who?","Where?","What is the main topic?"],"correct":"What was the result?","explanation":"As a result explicitly introduces the outcome of the earlier details.","topic":"clue words and 5W1H"},{"passageKey":"passage-3","sentenceIndex":1,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “after noticing that”?","clue":"“after noticing that”","options":["Why?","Who?","Where?","What is the main topic?"],"correct":"Why?","explanation":"This phrase introduces the observation that motivated the new approach.","topic":"clue words and 5W1H"},{"passageKey":"passage-3","sentenceIndex":3,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “After recording”?","clue":"“After recording”","options":["When / in what sequence?","Who?","Where?","What is the main topic?"],"correct":"When / in what sequence?","explanation":"After recording tells us when the next action happened in the process.","topic":"clue words and 5W1H"},{"passageKey":"passage-3","sentenceIndex":5,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “because”?","clue":"“because”","options":["Why did the improvement happen?","Who?","Where?","What is the main topic?"],"correct":"Why did the improvement happen?","explanation":"Because introduces the cause of the speaker’s reduced hesitation.","topic":"clue words and 5W1H"},{"passageKey":"passage-4","sentenceIndex":1,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “The main issue was that”?","clue":"“The main issue was that”","options":["What was the problem?","Who?","Where?","What is the main topic?"],"correct":"What was the problem?","explanation":"This phrase directly names the central problem.","topic":"clue words and 5W1H"},{"passageKey":"passage-4","sentenceIndex":2,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “our class representative”?","clue":"“our class representative”","options":["Who?","Why?","When?","How many?"],"correct":"Who?","explanation":"The noun phrase identifies the person who took the next action.","topic":"clue words and 5W1H"},{"passageKey":"passage-4","sentenceIndex":6,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “After one month”?","clue":"“After one month”","options":["When was the result observed?","Who?","Where?","What is the main topic?"],"correct":"When was the result observed?","explanation":"The time phrase tells us when the result became visible.","topic":"clue words and 5W1H"},{"passageKey":"passage-5","sentenceIndex":1,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “because”?","clue":"“because”","options":["Why?","Who?","Where?","What is the main topic?"],"correct":"Why?","explanation":"Because explains the speaker’s reason for wanting to learn.","topic":"clue words and 5W1H"},{"passageKey":"passage-5","sentenceIndex":2,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “how to cut”?","clue":"“how to cut”","options":["How?","Who?","Where?","What is the main topic?"],"correct":"How?","explanation":"How introduces the method or procedure taught by the grandmother.","topic":"clue words and 5W1H"},{"passageKey":"passage-5","sentenceIndex":7,"prompt":"Which 5W/1H sub-question is most strongly signaled by the clue “because”?","clue":"“because”","options":["Why did the skill build confidence?","Who?","Where?","What is the main topic?"],"correct":"Why did the skill build confidence?","explanation":"Because gives the reason for the final evaluation.","topic":"clue words and 5W1H"}],"mainIdeaQuestions":[{"passageKey":"passage-1","sentenceIndex":0,"prompt":"What is the main idea of the highlighted sentence?","options":["The speaker joined a local gardening project at a specific time and place.","The science teacher was an expert gardener.","The community center closed for winter.","The school required every student to volunteer."],"correct":"The speaker joined a local gardening project at a specific t     function modifierLessonMarkup(){

          <div class="excerpt-card"><h3>1 · Scope changes meaning</h3><p><strong>Only Maya borrowed the laptop.</strong> → nobody else did.\n<strong>Maya only borrowed the laptop.</strong> → she borrowed it; she did not buy/repair it.\n<strong>Maya borrowed only the laptop.</strong> → no other item.\n<strong>Maya borrowed the laptop only after class.</strong> → not at another time.</p></div>

          <div class="excerpt-card"><h3>3 · Opening modifiers</h3><p><strong>Correct:</strong> After reading the article, Lina understood the argument.\n<strong>Dangling:</strong> After reading the article, the argument became clear.\nAsk: <em>Who performed the opening action?</em> That person/thing should normally come immediately after the comma.</p></div>
          <div class="excerpt-card"><h3>4 · Keep descriptions beside nouns</h3><p><strong>Clear:</strong> We saw a man carrying a red umbrella.\nThe phrase <em>carrying a red umbrella</em> sits beside <em>man</em>, so the reader knows who is carrying it.</p></div>
          <div class="excerpt-card"><h3>5 · Natural adverb order</h3><p>Useful defaults: frequency adverbs before the main verb (<em>usually reviews</em>); keep verb + object together (<em>answered every question carefully</em>); and use place before time (<em>at school yesterday</em>).</p></div>

        </div>
      </div>`;
    }

      function grade(option,selectedButton,list){if(state.answered||!state.active)return;state.answered=true;const q=state.selected[state.index],ok=option===q.correct;$$('.option-btn',list).forEach(b=>{b.disabled=true;if(b.textContent===q.correct)b.classList.add('correct-choice');});if(!ok)selectedButton.classList.add('wrong-choice');if(ok)state.score++;state.responses.push({question:q,userAnswer:option,correct:ok});feedbackEl.hidden=false;feedbackEl.className=`feedback ${ok?'correct':'incorrect'}`;feedbackEl.innerHTML=`${ok?'✓ Correct':`✕ Incorrect<br><strong>Correct answer:</strong> ${esc(q.correct)}`}<br>${esc(q.explanation).replaceAll("\n","<br>")}`;nextBtn.hidden=false;nextBtn.textContent=state.index===state.selected.length-1?'Finish exercise':'Next question';updateHeader();nextBtn.focus();}
      function improve(){const misses=state.responses.filter(r=>!r.correct),counts=new Map();misses.forEach(r=>counts.set(r.question.topic,(counts.get(r.question.topic)||0)+1));if(!counts.size)return `<div class="improve-item"><strong>No priority weakness detected</strong><p>${state.responses.length?'Your attempted answers were correct. Try a larger question set or explain why each distractor is wrong.':'No answers were submitted yet.'}</p></div>`;return [...counts.entries()].sort((a,b)=>b[1]-a[1]).map(([topic,count])=>`<div class="improve-item"><strong>${esc(topic)} · ${count} missed</strong><p>${esc(DATA.improvementAdvice[topic]||'Review this pattern and write one new example before retrying.')}</p></div>`).join('');}
      function renderReview(){const box=$("[data-review-box]",finish);if(!box||!state.responses.length)return;const r=state.responses[state.reviewIndex],q=r.question;box.innerHTML=`<div class="review-label">Answer ${state.reviewIndex+1} of ${state.responses.length}</div><h4 style="font-size:1.2rem;line-height:1.35;margin:10px 0;">${esc(q.prompt)}</h4>${q.target?`<div class="review-context"><strong>Target sentence:</strong><br>${esc(q.target)}</div>`:""}<div class="review-answer"><strong>Your answer:</strong> ${esc(r.userAnswer)}<br><strong>Correct answer:</strong> ${esc(q.correct)}<br>${r.correct?'✓ Correct':'✕ Incorrect'}<br>${esc(q.explanation)}</div>`;$("[data-review-prev]",finish).disabled=state.reviewIndex===0;$("[data-review-next]",finish).disabled=state.reviewIndex===state.responses.length-1;}
      function finishExercise(reason){if(!state.active)return;stopTimer();state.active=false;live.hidden=true;finish.hidden=false;const answered=state.responses.length,correct=state.score,incorrect=answered-correct,unattempted=state.selected.length-answered,percent=answered?Math.round(correct/answered*100):0;finish.innerHTML=`<div class="finish-panel"><h4>Exercise Summary</h4><p class="summary-reason">${esc(reason)}. The score below uses the ${answered} question${answered===1?'':'s'} you answered.</p><div class="metric-grid"><div class="metric"><strong>${correct}/${answered}</strong><span>Answered score</span></div><div class="metric"><strong>${percent}%</strong><span>Accuracy</span></div><div class="metric"><strong>${incorrect}</strong><span>Incorrect</span></div><div class="metric"><strong>${unattempted}</strong><span>Not attempted</span></div></div><div class="metric-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));"><div class="metric"><strong>${formatTime(elapsed())}</strong><span>Time used</span></div><div class="metric"><strong>${state.totalSeconds?formatTime(Math.max(0,state.seconds)):'Untimed'}</strong><span>Time remaining</span></div></div><h4 style="font-size:1.35rem;line-height:1.2;margin-top:24px;">What to improve</h4><div class="improve-grid">${improve()}</div>${answered?`<div class="review-box" data-review-box></div><div class="review-nav"><button class="btn btn-secondary" type="button" data-review-prev>Previous answer</button><button class="btn btn-secondary" type="button" data-review-next>Next answer</button></div>`:""}<div class="button-row"><button class="btn btn-accent" type="button" data-retry>Retry same setup</button><button class="btn btn-secondary" type="button" data-back-menu>Back to menu</button></div></div>`;scoreBlock.textContent=`Final: ${correct} / ${answered}`;progressFill.style.width=state.selected.length?`${answered/state.selected.length*100}%`:'0%';if(answered){$("[data-review-prev]",finish).addEventListener('click',()=>{if(state.reviewIndex>0){state.reviewIndex--;renderReview();}});$("[data-review-next]",finish).addEventListener('click',()=>{if(state.reviewIndex<state.responses.length-1){state.reviewIndex++;renderReview();}});renderReview();}$("[data-retry]",finish).addEventListener('click',start);$("[data-back-menu]",finish).addEventListener('click',()=>{finish.hidden=true;live.hidden=true;menu.hidden=false;scoreBlock.textContent='Ready';progressFill.style.width='0%';menu.scrollIntoView({behavior:'smooth',block:'center'});});finish.scrollIntoView({behavior:'smooth',block:'start'});}
      if(sourceSelect)sourceSelect.addEventListener('change',syncCount);countInput.addEventListener('change',syncCount);$("[data-start]",card).addEventListener('click',start);nextBtn.addEventListener('click',()=>{if(!state.answered)return;if(state.index>=state.selected.length-1)finishExercise('Completed all selected questions');else{state.index++;renderQuestion();live.scrollIntoView({behavior:'smooth',block:'start'});}});$("[data-end]",card).addEventListener('click',()=>finishExercise('Exercise ended early'));syncCount();
    }

    function renderPage(){const main=$("#mainContent");sections.forEach(section=>{main.insertAdjacentHTML('beforeend',sectionMarkup(section));const mount=document.getElementById(`list-${section.id}`);exercises.filter(ex=>ex.sectionId===section.id).forEach(ex=>createExercise(ex,mount));});}
    function setupCollapseButtons(){$$("[data-collapse]").forEach(button=>button.addEventListener('click',()=>{const target=document.getElementById(button.dataset.collapse),collapsing=!target.hidden;if(collapsing){$$('[data-live]:not([hidden])',target).forEach(liveEl=>{const card=liveEl.closest('.exercise-card'),state=exerciseStates.get(card.id);if(state&&state.active){const end=$('[data-end]',card);if(end)end.click();}});}target.hidden=collapsing;button.textContent=collapsing?'Expand':'Collapse';button.setAttribute('aria-expanded',String(!collapsing));}));}
    function init(){setupTheme();renderTOC();renderPage();setupCollapseButtons();}
    init();
  })();
  </script>
</body>
</html>
