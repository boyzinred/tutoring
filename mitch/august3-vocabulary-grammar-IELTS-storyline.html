 difficult?","When do brothers and sisters usually finish their homework?","Where do families spend time together on public holidays?"],"correct":"Who joined me, and why did that person participate?","topic":"person and reason","explanation":"The sentence gives a companion and that person's motivation."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"We walked around the riverside park near our apartment at a steady pace.","options":["Where did we walk, and how intense was the activity?","Why do cities build paths beside rivers and lakes?","Who maintains the trees and benches in public parks?","When are apartment buildings busiest during the week?"],"correct":"Where did we walk, and how intense was the activity?","topic":"setting and manner","explanation":"The sentence gives a specific location and describes the pace."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"On rainy days, we used the indoor track at the community sports center.","options":["How did we adapt the routine when the weather changed?","What sports are usually played at community centers?","Why do some people prefer rain to hot weather?","Who checks the weather forecast before school?"],"correct":"How did we adapt the routine when the weather changed?","topic":"adaptation","explanation":"The sentence shows a practical alternative that keeps the routine consistent."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"At first, I often wanted to skip the walk when I felt tired.","options":["What obstacle made the new habit difficult at first?","How far can a healthy teenager walk without stopping?","Where do people rest after completing intense exercise?","Why do schools schedule physical education classes?"],"correct":"What obstacle made the new habit difficult at first?","topic":"initial obstacle","explanation":"The sentence identifies the temptation that threatened the routine."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"To stay consistent, we agreed to leave home immediately after washing the dinner dishes.","options":["What rule helped us follow the routine consistently?","Who usually washes dishes in families with children?","When do community sports centers close each evening?","Why are household routines different across cultures?"],"correct":"What rule helped us follow the routine consistently?","topic":"specific strategy","explanation":"The sentence gives a concrete trigger that made the habit easier to repeat."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"After two months, I fell asleep more easily and felt more alert in morning classes.","options":["What changes did I notice after following the habit?","How many classes do teenagers attend on a normal day?","Where do students sleep during long school holidays?","Why do some people prefer morning exercise to evening exercise?"],"correct":"What changes did I notice after following the habit?","topic":"measurable result","explanation":"The sentence reports two observable outcomes after a clear period of time."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"The routine also gave us time to discuss school and family plans.","options":["What additional social benefit came from the routine?","How are school plans announced to students each term?","Who organizes major events for families in the community?","When do teenagers usually make plans with their friends?"],"correct":"What additional social benefit came from the routine?","topic":"additional benefit","explanation":"The sentence adds a relationship benefit beyond physical health."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"This experience showed me that a simple activity is effective when it fits naturally into daily life.","options":["What general lesson can I draw from this example?","What equipment is required for professional walking competitions?","Where are health programs advertised to local residents?","Why do parks contain different types of walking surfaces?"],"correct":"What general lesson can I draw from this example?","topic":"reflection and relevance","explanation":"The conclusion explains why the example supports a broader recommendation."}]},{"key":"passage-3","label":"Passage 3 - Study technology","contextTitle":"What technology has improved your studies the most?","context":"The technology that improved my studies most was a small tablet with a digital note application. I began using it at the start of this school year because carrying six notebooks was uncomfortable. During class, I wrote short notes with a stylus and placed diagrams beside the relevant explanation. At home, I reorganized the notes into topic folders and added two or three practice questions. Before a biology test in November, I created a folder specifically for cell division. I reviewed that folder for ten minutes on the bus each morning. At first, I copied too much information and my pages became difficult to scan. I solved that problem by limiting each page to one main idea and three supporting points. My test preparation became faster because I could search key words and find old examples in seconds. The tablet did not replace effort, but it made my materials easier to organize and use anywhere.","questions":[{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"The technology that improved my studies most was a small tablet with a digital note application.","options":["What exact technology am I discussing?","Why do technology companies release new products each year?","Where can students compare prices for electronic devices?","Who invented the earliest forms of digital communication?"],"correct":"What exact technology am I discussing?","topic":"specific main idea","explanation":"The sentence names both the device and the application that matters."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"I began using it at the start of this school year because carrying six notebooks was uncomfortable.","options":["When did I start using it, and what problem did it solve?","How many notebooks do schools sell during the academic year?","Where do students store heavy bags during sports lessons?","Why do some people prefer handwriting to typing?"],"correct":"When did I start using it, and what problem did it solve?","topic":"time and reason","explanation":"The sentence gives a start point and a practical motivation."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"During class, I wrote short notes with a stylus and placed diagrams beside the relevant explanation.","options":["How did I use the device during lessons?","Who decides which diagrams appear in science textbooks?","When do students replace a damaged digital stylus?","Why are classroom explanations sometimes difficult to understand?"],"correct":"How did I use the device during lessons?","topic":"specific method","explanation":"The sentence describes two concrete actions during class."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"At home, I reorganized the notes into topic folders and added two or three practice questions.","options":["What follow-up steps did I take after class?","Where do families usually keep computer chargers at home?","Why do teachers assign questions at the end of a chapter?","Who creates the folder names in commercial note applications?"],"correct":"What follow-up steps did I take after class?","topic":"follow-up actions","explanation":"The sentence explains how raw notes became structured study material."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"Before a biology test in November, I created a folder specifically for cell division.","options":["What specific test situation can I use as an example?","How many biology topics are included in the school curriculum?","Where do scientists observe cells in professional laboratories?","Why is November a busy month for many schools?"],"correct":"What specific test situation can I use as an example?","topic":"anchor event","explanation":"The sentence introduces a named subject, month, and topic for a concrete example."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"I reviewed that folder for ten minutes on the bus each morning.","options":["When, where, and for how long did I review?","Who drove the bus during the speaker's morning journey?","Why do some students dislike traveling before school?","What types of folders are available in different applications?"],"correct":"When, where, and for how long did I review?","topic":"time place duration","explanation":"The sentence combines three precise details that make the routine easy to picture."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"At first, I copied too much information and my pages became difficult to scan.","options":["What problem appeared when I first used the method?","How many pages can a tablet store in its memory?","Where do students copy information during examinations?","Why do applications use different fonts and page colors?"],"correct":"What problem appeared when I first used the method?","topic":"initial problem","explanation":"The sentence creates a realistic weakness rather than claiming the tool worked perfectly."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"I solved that problem by limiting each page to one main idea and three supporting points.","options":["How did I respond to the organization problem?","Who taught the class how to write supporting paragraphs?","When do digital pages automatically save their content?","Why do students choose one subject instead of another?"],"correct":"How did I respond to the organization problem?","topic":"response and method","explanation":"The sentence gives a clear rule that solved the earlier problem."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"My test preparation became faster because I could search key words and find old examples in seconds.","options":["What result improved, and what feature caused it?","How many key words appear in an average biology textbook?","Where do old school examples get stored after graduation?","Who creates the search functions used by software companies?"],"correct":"What result improved, and what feature caused it?","topic":"result and cause","explanation":"The sentence connects a faster process to a specific digital feature."},{"prompt":"Which planning question most directly produces the highlighted sentence?","target":"The tablet did not replace effort, but it made my materials easier to organize and use anywhere.","options":["What balanced conclusion does the example support?","What other devices could completely replace studying in the future?","Why do students enjoy buying attractive electronic accessories?","Where are tablets manufactured before they reach consumers?"],"correct":"What balanced conclusion does the example support?","topic":"balanced reflection","explanation":"The conclusion states the benefit while rejecting the exaggerated idea that technology removes effort."}]}],"improvementAdvice":{"noun meaning":"Review the difference between abstract IELTS nouns and learn each word in one complete sentence.","verb meaning":"Practice using IELTS verbs with the correct subject and object rather than memorizing isolated translations.","adjective meaning":"Notice which nouns each adjective commonly describes and whether the meaning is positive, negative, or neutral.","placement of only":"Put only immediately before the word or phrase it limits.","modifier next to time phrase":"Place the limiting modifier directly beside the time expression it changes.","modifier next to object":"Keep a limiting word beside the object it limits.","modifier next to prepositional phrase":"Place only or just immediately before the prepositional phrase being limited.","placement of almost":"Decide whether almost modifies the action or the amount, then place it directly before that element.","scope of almost":"Check whether you mean that an action nearly happened or that nearly all of something was completed.","placement of just":"Use just before the main verb for recent time and before a number or noun phrase for limitation.","modifier next to amount":"Put nearly, almost, or just immediately before the amount.","modifier next to quantity":"Place the modifier directly before words such as every, all, or ten.","dangling introductory phrase":"The noun immediately after an opening phrase must be the person or thing performing that action.","dangling participial phrase":"After an -ing opening phrase, name the actual doer immediately.","logical subject after modifier":"Check who performed the opening action and make that person the main-clause subject.","modifier attached to noun":"Keep descriptive phrases directly beside the noun they describe.","dangling while-clause":"Make the subject after while + -ing the person performing both actions.","agent after introductory phrase":"Use an active subject after the opening phrase so the actor is clear.","past-participle modifier":"A past-participle phrase should be followed by the noun receiving that description.","dangling infinitive phrase":"The subject after to + verb must be the person intending to perform that action.","frequency phrase placement":"Place expressions such as almost every day at the end when they describe frequency.","verb-object-adverb order":"Keep the verb and object together, then place a manner adverb after them when natural.","place before time":"Use place before time in neutral sentence order.","frequency adverb placement":"Put usually, often, and rarely before a main verb but after be.","keep verb and object together":"Do not insert a long modifier between a transitive verb and its object.","object-place-time order":"A useful default order is subject + verb + object + place + time.","emphasis adverb placement":"Place emphasis adverbs close to the verb or subject they emphasize.","modifier next to noun":"Move the descriptive phrase directly next to its noun.","adverb before main verb":"Short adverbs can often appear before the main verb while the object remains after it.","regular past -ed":"Review how regular verbs form the simple past with -ed.","did not + base verb":"After did not or didn't, always return the main verb to its base form.","questions with did":"Build past questions with Did + subject + base verb.","regular past spelling -ied":"For consonant + y verbs, change y to i and add -ed.","regular past spelling doubled consonant":"Review when short verbs double the final consonant before -ed.","regular past spelling -d":"For verbs ending in e, add only -d.","did + base verb":"Did already marks the past, so use the base form after it.","irregular past form":"Study irregular verbs in base/past pairs and practice them in short sentences.","past of be - were":"Use were with you, we, they, and plural subjects.","past of be - was":"Use was with I, he, she, it, and singular subjects.","did not + irregular base form":"Even irregular verbs return to the base form after didn't.","did + irregular base form":"Use the base form, not the irregular past form, after Did.","short answers with were":"Match was/were questions with was/were short answers.","short answers with did":"Answer Did questions with did or didn't.","negative with did":"Use didn't + base verb for negative past actions.","past time marker":"Use the simple past for completed actions linked to a finished past time.","wh-question with did":"Use question word + did + subject + base verb.","sequence of irregular past actions":"Use the correct irregular past form for every completed action in a sequence.","past of be":"Do not add did to simple past statements with was or were.","anchor event":"Choose one real event with a clear time and place instead of discussing the whole topic generally.","storyline structure":"Build one chain: position, event, challenge, response, result, and lesson.","comparison":"Use a concrete comparison that directly supports your opinion.","result":"Include an observable change, outcome, or measurement.","person and action":"Name who was involved and what that person actually did.","problem-action-result":"State the obstacle, the action taken, and the result in that order.","condition and balance":"Add a realistic condition or limitation to avoid an extreme answer.","setting":"Give a precise time or place that helps the listener picture the event.","before-and-after":"Show what changed from before the experience to after it.","specific action":"Describe the steps you personally took, not only the general idea.","local example":"Use one nearby incident rather than giving a broad global lecture.","relevance":"Make every detail directly support the IELTS prompt.","balanced reflection":"State the benefit without claiming that the method removes all effort.","chronological order":"Arrange events in a clear time order.","evidence":"Prove a description with an observable action or result.","specific reason":"Replace generic reasons such as fun or useful with the exact problem solved.","reflection":"End by explaining why the experience still matters or what it changed.","position and condition":"State a clear opinion and add the condition under which it is true.","who and where":"Identify the person involved and a precise location.","time and duration":"Use an exact day, time, frequency, or length.","specific actions":"List concrete actions rather than broad activity labels.","initial challenge":"Include what was difficult at the beginning and why.","support and response":"Explain who helped and how the problem was handled.","development and result":"Show a change that happened after time or practice.","additional benefit":"Add a secondary benefit that is concrete and relevant.","cause and condition":"Explain why the result occurred and what rule made it possible.","reflection and relevance":"Connect the personal example back to the main IELTS idea.","main idea and duration":"Name the exact habit and add a realistic duration.","time and motivation":"Give the starting point and the reason for beginning.","person and reason":"State who joined or helped and why.","setting and manner":"Describe where the action happened and how it was performed.","adaptation":"Show how the plan changed when a practical problem appeared.","initial obstacle":"Name the behavior or feeling that made consistency difficult.","specific strategy":"Give one repeatable rule or trigger that solved the problem.","measurable result":"Include a result that could be observed after a stated period.","additional social benefit":"Add a meaningful benefit beyond the main claim.","specific main idea":"Name the exact object, tool, person, or activity instead of a broad category.","specific method":"Explain precisely how the tool or method was used.","follow-up actions":"Describe what you did after the first step to improve the result.","time place duration":"Combine when, where, and how long to make the example concrete.","initial problem":"Include a realistic weakness or mistake at the beginning.","response and method":"Explain the exact rule or action used to solve the problem.","result and cause":"Connect the improvement to the feature or action that caused it."}};

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function sample(array, count) { return shuffle(array).slice(0, Math.min(count, array.length)); }

    function formatTime(totalSeconds) {
      if (totalSeconds === 0) return "0:00";
      const min = Math.floor(totalSeconds / 60);
      const sec = totalSeconds % 60;
      return `${min}:${String(sec).padStart(2, "0")}`;
    }

    }

    function setupTheme() {
      setThemeButton();
      $("#themeToggle").addEventListener("click", () => {
        const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("grammar-ielts-theme", next); } catch (error) {}
        setThemeButton();
      });
    }

          <div class="exercise-list" id="list-${esc(section.id)}"></div>
        </div>
      </section>`;
    }

    function exerciseMarkup(exercise) {
      const sourceSelect = exercise.sourceOptions.length > 1 ? `
        <div class="menu-field">
          <label for="source-${exercise.id}">Question set</label>
          <select id="source-${exercise.id}" data-source>
            ${exercise.sourceOptions.map(opt => `<option value="${esc(opt.key)}">${esc(opt.label)}</option>`).join("")}
          </select>
        </div>` : "";
      return `<article class="exercise-card" id="${esc(exercise.id)}">
        <div class="exercise-head">
          <div class="exercise-head-copy"><h3>${esc(exercise.title)}</h3><p>${esc(exercise.instructions)}</p></div>
          <div class="score-block" data-score>Ready</div>
        </div>
        <div class="progress-track" aria-hidden="true"><div class="progress-fill" data-progress></div></div>
        <div class="exercise-menu" data-menu>
          <p class="menu-intro">${esc(exercise.description)}</p>
          <div class="menu-grid">
            ${sourceSelect}
            <div class="menu-field">
              <label for="count-${exercise.id}">Number of questions</label>
              <input id="count-${exercise.id}" data-count type="number" min="1" value="${exercise.defaultCount}" inputmode="numeric">
            </div>
            <div class="menu-field">
              <label for="timer-${exercise.id}">Timer</label>
              <select id="timer-${exercise.id}" data-timer>
                <option value="0" selected>Untimed</option>
                <option value="60">1 minute</option>
                <option value="180">3 minutes</option>
                <option value="300">5 minutes</option>
                <option value="600">10 minutes</option>
                <option value="900">15 minutes</option>
              </select>
            </div>
          </div>
          <div class="menu-note">Default: 10 questions</div>
          <div class="button-row"><button class="btn btn-primary" type="button" data-start>Start exercise</button></div>
        </div>
        <div class="question-stage" data-live hidden>
          <div class="live-toolbar">
            <div class="live-status"><strong data-live-score>Score: 0 / 0</strong><span data-live-progress>Question 1</span></div>
            <div class="mini-timer" data-live-timer>∞ Untimed</div>
            <button class="btn btn-danger" type="button" data-end>End exercise early</button>
          </div>
          <div data-context></div>
          <div class="question-meta" data-meta></div>
          <div class="question-text" data-question></div>
          <div data-answer-area></div>
          <div class="button-row"><button class="btn btn-success" type="button" data-next hidden>Next question</button></div>
          <div class="feedback" data-feedback hidden aria-live="polite"></div>
        </div>
        <div class="question-stage" data-finish hidden></div>
      </article>`;
    }

    function buildVocabOptions(question) {
      const samePos = DATA.vocab.filter(item => item.pos === question.pos && item.word !== question.word).map(item => item.definition);
      let distractors = [];
      let signature = "";
      const previous = vocabOptionHistory.get(question.word);
      for (let attempt = 0; attempt < 20; attempt++) {
        distractors = sample(samePos, 3);
        signature = [...distractors].sort().join("||");
        if (signature !== previous) break;
      }
      vocabOptionHistory.set(question.word, signature);
      return shuffle([question.correct, ...distractors]);
    }

    function createExercise(exercise, mount) {
      mount.insertAdjacentHTML("beforeend", exerciseMarkup(exercise));
      const card = document.getElementById(exercise.id);
      const menu = $("[data-menu]", card);
      const live = $("[data-live]", card);
      const finish = $("[data-finish]", card);
      const sourceSelect = $("[data-source]", card);
      const countInput = $("[data-count]", card);
      const timerSelect = $("[data-timer]", card);
      const startBtn = $("[data-start]", card);
      const endBtn = $("[data-end]", card);
      const scoreBlock = $("[data-score]", card);
      const progressFill = $("[data-progress]", card);
      const liveScore = $("[data-live-score]", card);
      const liveProgress = $("[data-live-progress]", card);
      const liveTimer = $("[data-live-timer]", card);
      const contextEl = $("[data-context]", card);
      const metaEl = $("[data-meta]", card);
      const questionEl = $("[data-question]", card);
      const answerArea = $("[data-answer-area]", card);
      const nextBtn = $("[data-next]", card);
      const feedbackEl = $("[data-feedback]", card);

      const state = {
        exercise, sourceKey: sourceSelect ? sourceSelect.value : "all", selected: [], index: 0,
        score: 0, responses: [], answered: false, interval: null, seconds: 0, totalSeconds: 0,
        startedAt: 0, endReason: "", reviewIndex: 0, active: false
      };
      exerciseStates.set(exercise.id, state);

      function sourceQuestions() {
        const key = sourceSelect ? sourceSelect.value : "all";
        return exercise.getQuestions(key);
      }

      function syncCountLimit() {
        const max = sourceQuestions().length;
        countInput.max = String(max);
        let value = Number.parseInt(countInput.value, 10);
        if (!Number.isFinite(value) || value < 1) value = Math.min(exercise.defaultCount, max);
        if (value > max) value = max;
        countInput.value = String(value);
      }

      function stopTimer() {
        if (state.interval) clearInterval(state.interval);
        state.interval = null;
      }

      function elapsedSeconds() {
        if (!state.startedAt) return 0;
        return Math.max(0, Math.round((Date.now() - state.startedAt) / 1000));
      }

      function updateHeader() {
        scoreBlock.textContent = state.active ? `Score: ${state.score} / ${state.responses.length}` : "Ready";
        liveScore.textContent = `Score: ${state.score} / ${state.responses.length}`;
        liveProgress.textContent = `Question ${Math.min(state.index + 1, state.selected.length)} of ${state.selected.length}`;
        progressFill.style.width = state.selected.length ? `${(state.responses.length / state.selected.length) * 100}%` : "0%";
      }

      function updateTimer() {
        if (state.totalSeconds === 0) {
          liveTimer.textContent = "∞ Untimed";
          liveTimer.classList.remove("warning");
          return;
        }
        liveTimer.textContent = formatTime(Math.max(0, state.seconds));
        liveTimer.classList.toggle("warning", state.seconds <= 30);
      }

      function prepareQuestion(raw) {
        const question = { ...raw };
        question.options = raw.dynamicVocab ? buildVocabOptions(raw) : shuffle(raw.options);
        return question;
      }

      function startExercise() {
        syncCountLimit();
        stopTimer();
        const count = Number.parseInt(countInput.value, 10);
        state.sourceKey = sourceSelect ? sourceSelect.value : "all";
        state.selected = sample(sourceQuestions(), count).map(prepareQuestion);
        state.index = 0;
        state.score = 0;
        state.responses = [];
        state.answered = false;
        state.totalSeconds = Number.parseInt(timerSelect.value, 10) || 0;
        state.seconds = state.totalSeconds;
        state.startedAt = Date.now();
        state.endReason = "";
        state.reviewIndex = 0;
        state.active = true;
        menu.hidden = true;
        finish.hidden = true;
        live.hidden = false;
        updateHeader();
        updateTimer();
        renderQuestion();
        if (state.totalSeconds > 0) {
          state.interval = setInterval(() => {
            state.seconds -= 1;
            updateTimer();
            if (state.seconds <= 0) finishExercise("Time expired");
          }, 1000);
        }
      }

      function renderQuestion() {
        state.answered = false;
        feedbackEl.hidden = true;
        feedbackEl.className = "feedback";
        nextBtn.hidden = true;
        const q = state.selected[state.index];
        metaEl.textContent = `Question ${state.index + 1} of ${state.selected.length}`;
        questionEl.textContent = q.prompt;
        contextEl.innerHTML = "";
        if (q.word) {
          contextEl.innerHTML = `<div class="word-card"><span>${esc(q.pos)}</span><strong>${esc(q.word)}</strong></div>`;
        } else if (q.context) {
          contextEl.innerHTML = `<div class="question-context"><strong>${esc(q.contextTitle || "IELTS-style paragraph")}</strong>${esc(q.context)}</div>${q.target ? `<div class="target-sentence">Highlighted sentence: ${esc(q.target)}</div>` : ""}`;
        } else if (q.target) {
          contextEl.innerHTML = `<div class="target-sentence">Highlighted sentence: ${esc(q.target)}</div>`;
        }
        const list = document.createElement("div");
        list.className = "option-list";
        q.options.forEach(option => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "option-btn";
          button.textContent = option;
          button.addEventListener("click", () => grade(option, button, list));
          list.appendChild(button);
        });
        answerArea.innerHTML = "";
        answerArea.appendChild(list);
        updateHeader();
      }

      function grade(option, selectedButton, list) {
        if (state.answered || !state.active) return;
        state.answered = true;
        const q = state.selected[state.index];
        const correct = option === q.correct;
        $$(".option-btn", list).forEach(button => {
          button.disabled = true;
          if (button.textContent === q.correct) button.classList.add("correct-choice");
        });
        if (!correct) selectedButton.classList.add("wrong-choice");
        if (correct) state.score += 1;
        state.responses.push({ question: q, userAnswer: option, correct, elapsed: elapsedSeconds() });
        feedbackEl.hidden = false;
        feedbackEl.className = `feedback ${correct ? "correct" : "incorrect"}`;
        feedbackEl.innerHTML = `${correct ? "✓ Correct" : `✕ Incorrect<br><strong>Correct answer:</strong> ${esc(q.correct)}`}<br>${esc(q.explanation).replaceAll("\n", "<br>")}`;
        nextBtn.hidden = false;
        nextBtn.textContent = state.index === state.selected.length - 1 ? "Finish exercise" : "Next question";
        updateHeader();
        nextBtn.focus();
      }

      function nextQuestion() {
        if (!state.answered) return;
        if (state.index >= state.selected.length - 1) finishExercise("Completed all selected questions");
        else {
          state.index += 1;
          renderQuestion();
          live.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      function improvementMarkup() {
        const misses = state.responses.filter(r => !r.correct);
        const counts = new Map();
        misses.forEach(r => counts.set(r.question.topic, (counts.get(r.question.topic) || 0) + 1));
        if (counts.size === 0) {
          if (state.responses.length === 0) return `<div class="improve-item"><strong>Start with one question</strong><p>No answers were submitted, so there is not enough evidence for a skill diagnosis yet.</p></div>`;
          if (state.responses.length < state.selected.length) return `<div class="improve-item"><strong>Accuracy is strong so far</strong><p>You answered the attempted questions correctly. Complete a larger sample to check whether the skill remains consistent.</p></div>`;
          return `<div class="improve-item"><strong>No priority weakness detected</strong><p>Explain why each wrong option is wrong to deepen control instead of relying only on recognition.</p></div>`;
        }
        return [...counts.entries()].sort((a,b) => b[1]-a[1]).slice(0, 5).map(([topic, count]) => {
          const advice = DATA.improvementAdvice[topic] || "Review this pattern and write one new example before restarting.";
          return `<div class="improve-item"><strong>${esc(topic)} · ${count} missed</strong><p>${esc(advice)}</p></div>`;
        }).join("");
      }

      function renderReview() {
        const box = $("[data-review-box]", finish);
        if (!box || state.responses.length === 0) return;
        const response = state.responses[state.reviewIndex];
        const q = response.question;
        box.innerHTML = `<div class="review-label">Answer ${state.reviewIndex + 1} of ${state.responses.length}</div>
          <h4 style="font-size:1.2rem;line-height:1.35;margin:10px 0;">${esc(q.prompt)}</h4>
          ${q.target ? `<div class="review-context"><strong>Target sentence:</strong><br>${esc(q.target)}</div>` : ""}
          <div class="review-answer"><strong>Your answer:</strong> ${esc(response.userAnswer)}<br><strong>Correct answer:</strong> ${esc(q.correct)}<br>${response.correct ? "✓ Correct" : "✕ Incorrect"}<br>${esc(q.explanation).replaceAll("\n", "<br>")}</div>`;
        $("[data-review-prev]", finish).disabled = state.reviewIndex === 0;
        $("[data-review-next]", finish).disabled = state.reviewIndex === state.responses.length - 1;
      }

      function finishExercise(reason) {
        if (!state.active) return;
        stopTimer();
        state.active = false;
        state.endReason = reason;
        live.hidden = true;
        finish.hidden = false;
        const answered = state.responses.length;
        const correct = state.score;
        const incorrect = answered - correct;
        const unattempted = state.selected.length - answered;
        const percent = answered ? Math.round(correct / answered * 100) : 0;
        const timeUsed = elapsedSeconds();
        finish.innerHTML = `<div class="finish-panel">
          <h4>Exercise Summary</h4>
          <p class="summary-reason">${esc(reason)}. The score below uses the ${answered} question${answered === 1 ? "" : "s"} you answered.</p>
          <div class="metric-grid">
            <div class="metric"><strong>${correct}/${answered}</strong><span>Answered score</span></div>
            <div class="metric"><strong>${percent}%</strong><span>Accuracy</span></div>
            <div class="metric"><strong>${incorrect}</strong><span>Incorrect</span></div>
            <div class="metric"><strong>${unattempted}</strong><span>Not attempted</span></div>
          </div>
          <div class="metric-grid" style="grid-template-columns:repeat(2,minmax(0,1fr));">
            <div class="metric"><strong>${formatTime(timeUsed)}</strong><span>Time used</span></div>
            <div class="metric"><strong>${state.totalSeconds ? formatTime(Math.max(0, state.seconds)) : "Untimed"}</strong><span>Time remaining</span></div>
          </div>
          <h4 style="font-size:1.35rem;line-height:1.2;margin-top:24px;">What to improve</h4>
          <div class="improve-grid">${improvementMarkup()}</div>
          ${answered ? `<div class="review-box" data-review-box></div>
          <div class="review-nav"><button class="btn btn-secondary" type="button" data-review-prev>Previous answer</button><button class="btn btn-secondary" type="button" data-review-next>Next answer</button></div>` : ""}
          <div class="button-row"><button class="btn btn-accent" type="button" data-retry>Retry same setup</button><button class="btn btn-secondary" type="button" data-back-menu>Back to menu</button></div>
        </div>`;
        scoreBlock.textContent = `Final: ${correct} / ${answered}`;
        progressFill.style.width = state.selected.length ? `${(answered / state.selected.length) * 100}%` : "0%";
        if (answered) {
          $("[data-review-prev]", finish).addEventListener("click", () => { if (state.reviewIndex > 0) { state.reviewIndex -= 1; renderReview(); } });
          $("[data-review-next]", finish).addEventListener("click", () => { if (state.reviewIndex < state.responses.length - 1) { state.reviewIndex += 1; renderReview(); } });
          renderReview();
        }
        $("[data-retry]", finish).addEventListener("click", startExercise);
        $("[data-back-menu]", finish).addEventListener("click", () => {
          finish.hidden = true;
          live.hidden = true;
          menu.hidden = false;
          scoreBlock.textContent = "Ready";
          progressFill.style.width = "0%";
          menu.scrollIntoView({ behavior: "smooth", block: "center" });
        });
        finish.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      if (sourceSelect) sourceSelect.addEventListener("change", syncCountLimit);
      countInput.addEventListener("change", syncCountLimit);
      startBtn.addEventListener("click", startExercise);
      nextBtn.addEventListener("click", nextQuestion);
      endBtn.addEventListener("click", () => finishExercise("Exercise ended early"));
      syncCountLimit();
    }

    function renderPage() {
      const main = $("#mainContent");
      sections.forEach(section => {
        main.insertAdjacentHTML("beforeend", sectionMarkup(section));
        const mount = document.getElementById(`list-${section.id}`);
        exercises.filter(ex => ex.sectionId === section.id).forEach(ex => createExercise(ex, mount));
      });
    }

    function setupCollapseButtons() {
      $$("[data-collapse]").forEach(button => {
        button.addEventListener("click", () => {
          const target = document.getElementById(button.dataset.collapse);
          const collapsing = !target.hidden;
          if (collapsing) {
            $$('[data-live]:not([hidden])', target).forEach(liveEl => {
              const card = liveEl.closest('.exercise-card');
              const state = exerciseStates.get(card.id);
              if (state && state.active) {
                const endButton = $('[data-end]', card);
                if (endButton) endButton.click();
              }
            });
          }
          target.hidden = collapsing;
          button.textContent = collapsing ? "Expand" : "Collapse";
          button.setAttribute("aria-expanded", String(!collapsing));
        });
      });
    }

    function init() {
      setupTheme();
      renderTOC();
      renderPage();
      setupCollapseButtons();
    }
    init();
  })();
  </script>
</body>
