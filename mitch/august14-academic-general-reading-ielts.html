<!DOCTYPE html>

  <script>
    (() => {
      try {
        const saved = localStorage.getItem('reading-lab-theme');
        const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      } catch (error) {
        document.documentElement.dataset.theme = 'light';

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap');

    :root {

    body{margin:0;min-height:100vh;color:var(--foreground);background:var(--muted);font-family:var(--font);font-size:16px;line-height:1.6}

    .home-link:hover,.theme-toggle:hover{background:var(--muted-strong)}
    .page-shell{width:min(1120px,calc(100% - 40px));margin:24px auto 64px;overflow:hidden;background:var(--surface);border-radius:var(--radius-lg)}

    .hero-copy p{max-width:68ch;margin:0;color:#EFF6FF;font-size:clamp(1rem,1.5vw,1.16rem)}

    .section-header p{max-width:50ch;margin:14px 0 0;font-weight:600;opacity:.82}.section-body{padding:clamp(22px,4vw,48px);background:var(--muted)}

    .exercise-card{overflow:hidden;background:var(--surface);border-radius:var(--radius-lg)}
    .exercise-head{display:grid;grid-template-columns:1fr auto;align-items:stretch;color:#fff;background:#111827}html[data-theme="dark"] .exercise-head{background:#030712}

    .exercise-menu,.quiz-stage,.finish-stage{padding:clamp(24px,4vw,38px)}.menu-intro{margin-bottom:20px;color:var(--text-muted)}

    .section-tip-strip{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;margin-bottom:18px;padding:17px;background:var(--accent-soft);border-left:7px solid var(--accent);border-radius:var(--radius-lg)}

    .quiz-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
    .passage-card{position:sticky;top:94px;max-height:calc(100vh - 116px);overflow:auto;padding:24px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-lg)}

    .passage-text p{margin:0 0 1em}.passage-text p:last-child{margin-bottom:0}.paragraph-letter{float:left;min-width:30px;margin-right:8px;color:var(--primary);font-weight:800}
    .question-card{padding:24px;background:var(--surface);border-radius:var(--radius-lg)}.question-meta{margin-bottom:10px;color:var(--primary)}
    .question-instruction{margin-bottom:14px;padding:10px 12px;color:var(--text-muted);background:var(--muted);border-radius:var(--radius-md);font-size:.91rem;font-weight:600}
    .question-text{margin:0 0 22px;font-size:clamp(1.25rem,2.4vw,1.85rem);font-weight:800;line-height:1.28}.option-list{display:grid;gap:10px}
    .option-btn{width:100%;min-height:58px;padding:14px 16px;color:var(--foreground);background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-md);text-align:left;font-weight:700;transition:var(--transition)}
    .option-btn:hover{background:var(--blue-soft);border-color:var(--primary);transform:translateX(4px)}.option-btn.selected{background:var(--blue-soft);border-color:var(--primary)}
    .option-key{display:inline-grid;width:28px;height:28px;place-items:center;margin-right:9px;color:var(--foreground);background:var(--muted-strong);border-radius:50%;font-size:.78rem;font-weight:800}.option-btn.selected .option-key{color:#fff;background:var(--primary)}
    .answer-input{width:100%;min-height:54px;padding:12px 14px;color:var(--foreground);background:var(--surface);border:2px solid var(--border);border-radius:var(--radius-md);outline:none}.answer-input:focus{border-color:var(--primary)}
    .answer-help{margin:9px 0 0;color:var(--text-muted);font-size:.86rem}
    .finish-panel{padding:28px;background:var(--blue-soft);border-radius:var(--radius-lg)}.finish-panel h4{font-size:clamp(1.8rem,4vw,3rem);font-weight:800}
    .metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:20px 0}.metric{padding:16px;background:var(--surface);border-radius:var(--radius-md)}.metric strong{display:block;color:var(--primary);font-size:1.6rem}.metric span{color:var(--text-muted);font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .breakdown{display:grid;gap:8px;margin-top:18px}.breakdown-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 14px;background:var(--surface);border-radius:var(--radius-md)}.breakdown-row span:last-child{font-weight:800;color:var(--primary)}
    .review-box{margin-top:14px;padding:18px;background:var(--surface);border-radius:var(--radius-lg)}.review-box.correct{border-left:7px solid var(--secondary)}.review-box.incorrect{border-left:7px solid var(--danger)}
    .review-box h5{margin:0 0 8px;font-size:1.05rem;line-height:1.3}.review-box p{margin:4px 0;color:var(--text-muted)}.review-box .result-label{font-weight:800}.review-box.correct .result-label{color:var(--secondary)}.review-box.incorrect .result-label{color:var(--danger)}.review-section-title{margin:30px 0 8px;font-size:1.35rem}
    .back-to-top{position:fixed;right:18px;bottom:18px;z-index:60;width:46px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:#111827;border-radius:50%;text-decoration:none;font-size:1rem}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
    @media(max-width:1050px){.lesson-steps{grid-template-columns:repeat(2,minmax(0,1fr))}.lesson-step:last-child{grid-column:1/-1}}
    @media(max-width:900px){.quiz-layout{grid-template-columns:1fr}.passage-card{position:static;max-height:none}.tip-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:680px){.header-inner{width:calc(100% - 28px)}.brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.page-shell{width:100%;margin:0;border-radius:0}.hero-copy{padding:48px 22px}.section-header{padding-left:22px;padding-right:22px}.section-body{padding-left:16px;padding-right:16px}.exercise-head{grid-template-columns:1fr}.score-block{min-width:0;min-height:52px}.lesson-heading{grid-template-columns:1fr}.lesson-steps{grid-template-columns:1fr}.lesson-step:last-child{grid-column:auto}.live-toolbar{position:static;grid-template-columns:1fr}.mini-timer{width:100%}.button-row{display:grid}.btn{width:100%}.metric-grid{grid-template-columns:1fr}.back-to-top{right:8px;bottom:8px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;transform:none!important}}
  </style>
</head>

<script>
const TEST_DATA = {
  sections: [
    {
      id: 'academic',
      name: 'Academic Reading',
      passageLabel: 'Academic Reading Passage',
      title: 'The Hidden Value of Urban Wetlands',
      overview: 'This passage explains why some cities are restoring wetlands and why those projects must be planned and maintained carefully.',
      focusTitle: 'Academic section focus',
      focusText: 'Separate the writer’s main claim from examples. For True/False/Not Given, use only the passage: “Not Given” means the text does not provide enough evidence, not that the statement sounds unlikely.',
      tips: [
        {
          label: 'Skim first',
          title: 'Map the paragraph purposes',
          text: 'Read the first and last sentence of each paragraph and note its main function before answering detailed questions.'
        },
        {
          label: 'Track paraphrases',
          title: 'Expect different wording',
          text: 'Questions rarely repeat the passage exactly. Look for matching meaning rather than identical vocabulary.'
        },
        {
          label: 'Control assumptions',
          title: 'Do not add outside knowledge',
          text: 'A reasonable idea can still be wrong if the passage does not state or support it.'
        }
      ],
      paragraphs: [
        {
          letter: 'A',
          text: 'For much of the twentieth century, wetlands inside cities were treated as wasted land. They were drained, filled with soil, or forced into narrow concrete channels so that roads and buildings could be constructed. More recently, however, urban planners have begun to reconsider this approach. As heavier rain, hotter summers, and the loss of wildlife become more visible, some cities are restoring marshes, ponds, and wet grasslands as part of their public infrastructure.'
        },
        {
          letter: 'B',
          text: 'One important benefit is flood control. A healthy wetland behaves rather like a shallow storage basin: it receives rainwater, holds it for a period, and releases it slowly. This process can reduce the sudden rush of water into streets and underground drains. A single restored site cannot prevent every flood, and wetlands do not remove the need for pipes or emergency channels. Nevertheless, when they are connected to a wider drainage system, they can reduce pressure on that system during intense storms.'
        },
        {
          letter: 'C',
          text: 'Wetlands may also cool the neighbourhoods around them. Water evaporating from ponds and moisture released by plants absorb heat from the surrounding air. Studies in several cities have recorded local temperature differences of one or two degrees Celsius near larger wetland parks on hot days. This cooling effect is not identical everywhere. It depends on the size of the site, the amount of open water, the type of vegetation, wind direction, and the density of nearby buildings.'
        },
        {
          letter: 'D',
          text: 'A further advantage is the creation of habitat. Urban development often divides natural areas into small, isolated pieces. A chain of ponds and marshes can act as stepping stones, allowing birds, insects, and amphibians to move across the city. Poorly designed wetlands, however, may create problems. Still water with little plant diversity can encourage mosquitoes. By contrast, wetlands with moving water and a balanced food web often support fish, dragonflies, and other animals that feed on mosquito larvae.'
        },
        {
          letter: 'E',
          text: 'The social value of these places is harder to measure but should not be ignored. Walking routes, viewing platforms, and outdoor classrooms can turn a technical flood project into a public space. People may use the area for exercise, nature study, or quiet rest. Access must still be managed. Paths placed too close to nesting areas can disturb wildlife, while unrestricted dogs may damage vegetation. Good design therefore gives visitors clear routes while leaving some zones protected.'
        },
        {
          letter: 'F',
          text: 'Restoration is sometimes presented as a low-cost solution, but a wetland is not maintenance-free. Invasive plants may spread rapidly, litter must be removed, and channels can become blocked. Sediment also builds up over time and reduces the wetland’s storage capacity. These tasks require regular inspection and long-term funding. Even so, the total cost may remain lower than repeatedly enlarging concrete drainage systems, especially when recreation and wildlife benefits are included in the calculation.'
        },
        {
          letter: 'G',
          text: 'The Riverside East project illustrates both the promise and the difficulty of measuring results. A concrete storm-water basin was replaced by a shallow wetland with reed beds, paths, and a small outdoor classroom. In the four years after completion, residents reported fewer flooded gardens. Yet new street drains were installed at the same time, so the improvement cannot be credited to the wetland alone. Local schools now test water quality and record bird species, creating a useful body of information for future planning.'
        },
        {
          letter: 'H',
          text: 'Urban wetlands are therefore best understood as one part of a mixed strategy. They can store storm water, reduce local heat, support wildlife, and provide attractive public spaces. They also need land, careful design, and continuous care. The strongest projects do not replace traditional infrastructure completely; instead, they combine natural systems with pipes, channels, building rules, and emergency planning.'
        }
      ],
      questions: [
        {
          type: 'choice',
          questionType: 'Matching headings',
          instruction: 'Choose the best heading for Paragraph B.',
          prompt: 'Paragraph B',
          options: [
            'A natural defence against heavy rain',
            'A refuge in a broken landscape',
            'The need for continued care',
            'Managing public access responsibly',
            'A source of local cooling',
            'The limits of measuring public opinion'
          ],
          answer: 'A natural defence against heavy rain',
          explanation: 'Paragraph B explains how wetlands store rainwater temporarily and reduce pressure on drains during storms.'
        },
        {
          type: 'choice',
          questionType: 'Matching headings',
          instruction: 'Choose the best heading for Paragraph C.',
          prompt: 'Paragraph C',
          options: [
            'The need for continued care',
            'A refuge in a broken landscape',
            'A source of local cooling',
            'Managing public access responsibly',
            'A natural defence against heavy rain',
            'The limits of measuring public opinion'
          ],
          answer: 'A source of local cooling',
          explanation: 'Paragraph C focuses on evaporation, plants, and the possible reduction of local temperatures.'
        },
        {
          type: 'choice',
          questionType: 'Matching headings',
          instruction: 'Choose the best heading for Paragraph D.',
          prompt: 'Paragraph D',
          options: [
            'A source of local cooling',
            'Managing public access responsibly',
            'A refuge in a broken landscape',
            'The need for continued care',
            'The limits of measuring public opinion',
            'A natural defence against heavy rain'
          ],
          answer: 'A refuge in a broken landscape',
          explanation: 'Paragraph D describes wetlands as connected habitats that help wildlife move through developed areas.'
        },
        {
          type: 'choice',
          questionType: 'Matching headings',
          instruction: 'Choose the best heading for Paragraph E.',
          prompt: 'Paragraph E',
          options: [
            'The need for continued care',
            'A natural defence against heavy rain',
            'Managing public access responsibly',
            'A refuge in a broken landscape',
            'A source of local cooling',
            'The limits of measuring public opinion'
          ],
          answer: 'Managing public access responsibly',
          explanation: 'Paragraph E discusses public use while explaining why some wildlife areas need protection.'
        },
        {
          type: 'choice',
          questionType: 'Matching headings',
          instruction: 'Choose the best heading for Paragraph F.',
          prompt: 'Paragraph F',
          options: [
            'The limits of measuring public opinion',
            'A refuge in a broken landscape',
            'The need for continued care',
            'A source of local cooling',
            'Managing public access responsibly',
            'A natural defence against heavy rain'
          ],
          answer: 'The need for continued care',
          explanation: 'Paragraph F lists maintenance needs such as removing litter, controlling invasive plants, and clearing sediment.'
        },
        {
          type: 'choice',
          questionType: 'True / False / Not Given',
          instruction: 'Decide whether the statement agrees with the passage.',
          prompt: 'Restored wetlands can completely replace conventional drainage systems in cities.',
          options: ['True', 'False', 'Not Given'],
          answer: 'False',
          fixedOrder: true,
          explanation: 'The passage says wetlands do not remove the need for pipes or emergency channels.'
        },
        {
          type: 'choice',
          questionType: 'True / False / Not Given',
          instruction: 'Decide whether the statement agrees with the passage.',
          prompt: 'The cooling effect of an urban wetland can vary according to its design and surroundings.',
          options: ['True', 'False', 'Not Given'],
          answer: 'True',
          fixedOrder: true,
          explanation: 'Paragraph C lists several factors that influence the cooling effect.'
        },
        {
          type: 'choice',
          questionType: 'True / False / Not Given',

              </div>
            </div>

            <div class="finish-stage" data-role="finish" hidden></div>
          </article>
        </div>
      </section>
    `;
  }

  class ReadingExercise {
    constructor(root, sourceSection) {
      this.root = root;
      this.sourceSection = sourceSection;
      this.els = {
        score: $('[data-role="score"]', root), progress: $('[data-role="progress"]', root),
        menu: $('[data-role="menu"]', root), timerSelect: $('[data-role="timer-select"]', root),
        start: $('[data-role="start"]', root), quiz: $('[data-role="quiz"]', root), finish: $('[data-role="finish"]', root),
        liveProgress: $('[data-role="live-progress"]', root), liveTimer: $('[data-role="live-timer"]', root),
        end: $('[data-role="end"]', root), passage: $('[data-role="passage"]', root),
        questionMeta: $('[data-role="question-meta"]', root), questionInstruction: $('[data-role="question-instruction"]', root),
        questionText: $('[data-role="question-text"]', root), answerArea: $('[data-role="answer-area"]', root),
        skip: $('[data-role="skip"]', root), next: $('[data-role="next"]', root)
      };
      this.state = { active:false, timerId:null, totalSeconds:0, seconds:0, startedAt:0, index:0, questions:[], responses:[], currentAnswer:'' };
      this.els.start.addEventListener('click', () => this.start());
      this.els.next.addEventListener('click', () => this.saveAndAdvance(false));
      this.els.skip.addEventListener('click', () => this.saveAndAdvance(true));
      this.els.end.addEventListener('click', () => this.finish('Exercise ended early'));
      this.els.passage.innerHTML = this.passageHtml(sourceSection.paragraphs);
    }

    prepareQuestions() {
      return this.sourceSection.questions.map((question) => ({
        ...question,
        shownOptions: question.type === 'choice' ? (question.fixedOrder ? [...question.options] : shuffle(question.options)) : []
      }));
    }

    passageHtml(paragraphs) {
      return paragraphs.map((paragraph) => `<p><span class="paragraph-letter">${escapeHtml(paragraph.letter)}</span>${escapeHtml(paragraph.text)}</p>`).join('');
    }

    start() {
      this.stopTimer();
      this.state.active = true;
      this.state.totalSeconds = Number.parseInt(this.els.timerSelect.value, 10) || 0;
      this.state.seconds = this.state.totalSeconds;
      this.state.startedAt = Date.now();
      this.state.index = 0;
      this.state.questions = this.prepareQuestions();
      this.state.responses = [];
      this.state.currentAnswer = '';
      this.els.menu.hidden = true;
      this.els.finish.hidden = true;
      this.els.quiz.hidden = false;
      this.els.score.textContent = 'In progress';
      this.els.progress.style.width = '0%';
      this.startTimer();
      this.renderQuestion();
      this.els.quiz.scrollIntoView({behavior:'smooth', block:'start'});
    }

    startTimer() {
      this.updateTimer();
      if (!this.state.totalSeconds) return;
      this.state.timerId = window.setInterval(() => {
        this.state.seconds -= 1;
        this.updateTimer();
        if (this.state.seconds <= 0) this.finish('Time expired');
      }, 1000);
    }

    stopTimer() {
      if (this.state.timerId) window.clearInterval(this.state.timerId);
      this.state.timerId = null;
    }

    updateTimer() {
      if (!this.state.totalSeconds) {
        this.els.liveTimer.textContent = '∞ Untimed';
        this.els.liveTimer.classList.remove('warning');
        return;
      }
      this.els.liveTimer.textContent = formatTime(this.state.seconds);
      this.els.liveTimer.classList.toggle('warning', this.state.seconds <= 300);
    }

    renderQuestion() {
      const question = this.state.questions[this.state.index];
      this.state.currentAnswer = '';
      this.els.liveProgress.textContent = `Question ${this.state.index + 1} of ${this.state.questions.length} · ${this.state.responses.length} answered`;
      this.els.questionMeta.textContent = `${question.questionType} · Question ${this.state.index + 1}`;
      this.els.questionInstruction.textContent = question.instruction;
      this.els.questionText.textContent = question.prompt;
      this.els.answerArea.innerHTML = '';

      if (question.type === 'choice') {
        const optionList = document.createElement('div');
        optionList.className = 'option-list';
        question.shownOptions.forEach((option, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'option-btn';
          button.innerHTML = `<span class="option-key">${String.fromCharCode(65 + index)}</span>${escapeHtml(option)}`;
          button.addEventListener('click', () => {
            this.state.currentAnswer = option;
            $$('.option-btn', optionList).forEach((item) => item.classList.remove('selected'));
            button.classList.add('selected');
          });
          optionList.appendChild(button);
        });
        this.els.answerArea.appendChild(optionList);
      } else {
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'answer-input'; input.autocomplete = 'off'; input.spellcheck = false;
        input.placeholder = 'Type your answer'; input.setAttribute('aria-label', 'Type your answer');
        input.addEventListener('input', () => { this.state.currentAnswer = input.value; });
        input.addEventListener('keydown', (event) => { if (event.key === 'Enter') this.saveAndAdvance(false); });
        this.els.answerArea.appendChild(input);
        const help = document.createElement('p'); help.className = 'answer-help'; help.textContent = question.wordLimit;
        this.els.answerArea.appendChild(help);
        window.setTimeout(() => input.focus(), 50);
      }
      this.updateProgress();
    }

    evaluate(question, answer) {
      if (!answer) return false;
      if (question.type === 'choice') return answer === question.answer;
      return question.answers.map(normalize).includes(normalize(answer));
    }

    saveAndAdvance(skipped) {
      if (!this.state.active) return;
      const question = this.state.questions[this.state.index];
      const userAnswer = skipped ? '' : String(this.state.currentAnswer ?? '').trim();
      this.state.responses.push({
        questionType: question.questionType, prompt: question.prompt, userAnswer,
        correctAnswer: question.type === 'choice' ? question.answer : question.displayAnswer,
        explanation: question.explanation, correct: this.evaluate(question, userAnswer), skipped: !userAnswer
      });
      if (this.state.index >= this.state.questions.length - 1) {
        this.finish(`Completed all ${this.state.questions.length} questions`);
        return;
      }
      this.state.index += 1;
      this.renderQuestion();
      $('.question-card', this.root).scrollIntoView({behavior:'smooth', block:'start'});
    }

    updateProgress() {
      const total = this.state.questions.length || this.sourceSection.questions.length;
      this.els.progress.style.width = `${(this.state.responses.length / total) * 100}%`;
      if (!this.els.quiz.hidden) this.els.liveProgress.textContent = `Question ${this.state.index + 1} of ${total} · ${this.state.responses.length} answered`;
    }

    finish(reason) {
      if (!this.state.active) return;
      this.state.active = false;
      this.stopTimer();
      this.els.menu.hidden = true;
      this.els.quiz.hidden = true;
      this.els.finish.hidden = false;
      const total = this.state.questions.length || this.sourceSection.questions.length;
      const answered = this.state.responses.filter((response) => !response.skipped).length;
      const blank = total - answered;
      const score = this.state.responses.filter((response) => response.correct).length;
      const accuracy = Math.round((score / total) * 100);
      const elapsed = Math.max(0, Math.round((Date.now() - this.state.startedAt) / 1000));

      const typeMap = new Map();
      this.state.responses.forEach((response) => {
        const item = typeMap.get(response.questionType) || {correct:0,total:0};
        item.total += 1; if (response.correct) item.correct += 1; typeMap.set(response.questionType, item);
      });
      const typeRows = [...typeMap.entries()].map(([type, result]) => `<div class="breakdown-row"><span>${escapeHtml(type)}</span><span>${result.correct}/${result.total}</span></div>`).join('');
      const review = this.state.responses.map((response, index) => `
        <div class="review-box ${response.correct ? 'correct' : 'incorrect'}">
          <h5>${index + 1}. ${escapeHtml(response.prompt)}</h5>
          <p class="result-label">${response.correct ? 'Correct' : (response.skipped ? 'Skipped' : 'Incorrect')}</p>
          <p><strong>Your answer:</strong> ${response.userAnswer ? escapeHtml(response.userAnswer) : 'No answer'}</p>
          <p><strong>Correct answer:</strong> ${escapeHtml(response.correctAnswer)}</p>
          <p>${escapeHtml(response.explanation)}</p>
        </div>
      `).join('');
      const notReached = this.state.responses.length < total ? `<div class="review-box incorrect"><h5>Questions not reached</h5><p>${total - this.state.responses.length} question(s) were not reached before the exercise ended.</p></div>` : '';

      this.els.finish.innerHTML = `
        <div class="finish-panel">
          <h4>${escapeHtml(this.sourceSection.name)} Summary</h4>
          <p>${escapeHtml(reason)}.</p>
          <div class="metric-grid">
            <div class="metric"><strong>${score}/${total}</strong><span>Score</span></div>
            <div class="metric"><strong>${accuracy}%</strong><span>Accuracy</span></div>
            <div class="metric"><strong>${blank}</strong><span>Blank or not reached</span></div>
            <div class="metric"><strong>${formatTime(elapsed)}</strong><span>Time used</span></div>
          </div>
          <h5 class="review-section-title">Score by question type</h5>
          <div class="breakdown">${typeRows || '<div class="breakdown-row"><span>No questions answered</span><span>0</span></div>'}</div>
          <h5 class="review-section-title">Answer review</h5>
          ${review || '<div class="review-box incorrect"><p>No answers were submitted.</p></div>'}
          ${notReached}
          <div class="button-row">
            <button class="btn btn-accent" data-action="retry" type="button">Retry this exercise</button>
            <button class="btn btn-secondary" data-action="menu" type="button">Back to exercise menu</button>
          </div>
        </div>
      `;
      this.els.score.textContent = `Final: ${score} / ${total}`;
      this.els.progress.style.width = `${(this.state.responses.length / total) * 100}%`;
      $('[data-action="retry"]', this.els.finish).addEventListener('click', () => this.start());
      $('[data-action="menu"]', this.els.finish).addEventListener('click', () => this.returnToMenu());
      this.els.finish.scrollIntoView({behavior:'smooth', block:'start'});
    }

    returnToMenu() {
      this.stopTimer();
      this.state.active = false;
      this.els.finish.hidden = true;
      this.els.quiz.hidden = true;
      this.els.menu.hidden = false;
      this.els.score.textContent = 'Ready';
      this.els.progress.style.width = '0%';
      this.els.menu.scrollIntoView({behavior:'smooth', block:'start'});
    }
  }

  const container = $('#exerciseContainer');
  container.innerHTML = TEST_DATA.sections.map(exerciseHtml).join('');
  TEST_DATA.sections.forEach((section) => {
    const root = $(`#${section.id}-exercise`);
    new ReadingExercise(root, section);
  });
  setupTheme();
})();
</script>
</body>
</html>
